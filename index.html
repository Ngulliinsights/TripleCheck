<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>TripleCheck - Secure Real Estate Verification</title>
    <meta
      name="title"
      content="TripleCheck - Secure Real Estate Verification"
    />
    <meta
      name="description"
      content="Professional real estate verification platform ensuring secure and accurate property transactions."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://triplecheck.app/" />
    <meta
      property="og:title"
      content="TripleCheck - Secure Real Estate Verification"
    />
    <meta
      property="og:description"
      content="Professional real estate verification platform ensuring secure and accurate property transactions."
    />
    <meta property="og:image" content="/assets/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://triplecheck.app/" />
    <meta
      property="twitter:title"
      content="TripleCheck - Secure Real Estate Verification"
    />
    <meta
      property="twitter:description"
      content="Professional real estate verification platform ensuring secure and accurate property transactions."
    />
    <meta property="twitter:image" content="/assets/og-image.png" />

    <!-- Favicon Configuration - Optimized Setup -->
    <!-- Modern SVG favicon for scalability and crisp rendering -->
    <link rel="icon" type="image/svg+xml" href="/assets/Artmark.svg" />

    <!-- PNG fallbacks for better compatibility -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/favicon-16x16.png"
    />

    <!-- Apple Touch Icon - Single optimized size -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/apple-touch-icon.png"
    />

    <!-- Android Chrome Icons -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/assets/android-chrome-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/assets/android-chrome-512x512.png"
    />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/assets/site.webmanifest" />

    <!-- Windows Metro Tile -->
    <meta name="msapplication-TileImage" content="/assets/mstile-150x150.png" />
    <meta name="msapplication-TileColor" content="#14b8a6" />
    <meta name="msapplication-config" content="/assets/browserconfig.xml" />

    <!-- Theme Colors for Enhanced Branding -->
    <meta name="theme-color" content="#14b8a6" />
    <meta name="msapplication-navbutton-color" content="#14b8a6" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TripleCheck" />

    <!-- DNS Prefetch for Performance -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//api.triplecheck.app" />

    <!-- Preload Critical Resources -->
    <link
      rel="preload"
      href="/assets/fonts/primary-font.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Security Headers (Note: X-Frame-Options should be set via HTTP headers, not meta tags) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
