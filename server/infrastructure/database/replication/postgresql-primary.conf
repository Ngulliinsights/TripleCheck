# PostgreSQL Primary Server Configuration for TripleCheck
# High Availability Setup with Streaming Replication

#------------------------------------------------------------------------------
# CONNECTIONS AND AUTHENTICATION
#------------------------------------------------------------------------------

# Connection settings
listen_addresses = '*'
port = 5432
max_connections = 200
superuser_reserved_connections = 3

# Authentication
authentication_timeout = 60s
password_encryption = scram-sha-256

#------------------------------------------------------------------------------
# RESOURCE USAGE (except WAL)
#------------------------------------------------------------------------------

# Memory settings
shared_buffers = 256MB                  # 25% of RAM for dedicated server
effective_cache_size = 1GB              # 75% of RAM
work_mem = 4MB                          # Per operation memory
maintenance_work_mem = 64MB             # Maintenance operations
dynamic_shared_memory_type = posix

# Background writer
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0
bgwriter_flush_after = 512kB

#------------------------------------------------------------------------------
# WRITE AHEAD LOG (WAL) - Critical for Replication
#------------------------------------------------------------------------------

# WAL settings for replication
wal_level = replica                     # Enable replication
wal_log_hints = on                      # Required for pg_rewind
wal_buffers = 16MB                      # WAL buffer size
wal_writer_delay = 200ms                # WAL writer frequency
wal_writer_flush_after = 1MB            # Force flush after this amount

# Checkpoints
checkpoint_timeout = 5min               # Checkpoint frequency
checkpoint_completion_target = 0.9      # Spread checkpoint I/O
checkpoint_flush_after = 256kB          # Force flush during checkpoint
checkpoint_warning = 30s                # Warn if checkpoints are too frequent

# WAL archiving (for point-in-time recovery)
archive_mode = on                       # Enable WAL archiving
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'
archive_timeout = 300                   # Force archive every 5 minutes

# WAL retention
wal_keep_size = 1GB                     # Keep 1GB of WAL files
max_wal_size = 2GB                      # Maximum WAL size before checkpoint
min_wal_size = 80MB                     # Minimum WAL size

#------------------------------------------------------------------------------
# REPLICATION
#------------------------------------------------------------------------------

# Sending servers
max_wal_senders = 10                    # Maximum number of WAL senders
max_replication_slots = 10              # Maximum replication slots
wal_sender_timeout = 60s                # Timeout for WAL senders

# Synchronous replication settings
synchronous_standby_names = 'replica-1,replica-2'  # Standby servers for sync replication
synchronous_commit = remote_write       # Wait for remote write confirmation

# Replication slots (for guaranteed WAL retention)
# These should be created manually for each replica:
# SELECT pg_create_physical_replication_slot('replica_1_slot');
# SELECT pg_create_physical_replication_slot('replica_2_slot');

#------------------------------------------------------------------------------
# QUERY TUNING
#------------------------------------------------------------------------------

# Planner settings
random_page_cost = 1.1                  # SSD-optimized
effective_io_concurrency = 200          # SSD concurrent I/O
seq_page_cost = 1.0                     # Sequential scan cost

# Query execution
max_parallel_workers_per_gather = 2     # Parallel query workers
max_parallel_workers = 8                # Total parallel workers
max_parallel_maintenance_workers = 2    # Parallel maintenance workers

#------------------------------------------------------------------------------
# ERROR REPORTING AND LOGGING
#------------------------------------------------------------------------------

# Logging settings
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_file_mode = 0600
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = on

# What to log
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 1000       # Log slow queries (>1s)
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 10MB
log_autovacuum_min_duration = 0
log_error_verbosity = default

# Log format
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_statement = 'ddl'                   # Log DDL statements
log_replication_commands = on           # Log replication commands

#------------------------------------------------------------------------------
# RUNTIME STATISTICS
#------------------------------------------------------------------------------

# Statistics settings
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all
stats_temp_directory = 'pg_stat_tmp'

# Query statistics
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.track_utility = on
pg_stat_statements.save = on

#------------------------------------------------------------------------------
# AUTOVACUUM PARAMETERS
#------------------------------------------------------------------------------

# Autovacuum settings
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.2
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.1
autovacuum_vacuum_cost_delay = 20ms
autovacuum_vacuum_cost_limit = 200

#------------------------------------------------------------------------------
# CLIENT CONNECTION DEFAULTS
#------------------------------------------------------------------------------

# Locale and formatting
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'

# Connection defaults
default_transaction_isolation = 'read committed'
statement_timeout = 300s                # 5 minute statement timeout
lock_timeout = 30s                      # 30 second lock timeout
idle_in_transaction_session_timeout = 600s  # 10 minute idle timeout

#------------------------------------------------------------------------------
# LOCK MANAGEMENT
#------------------------------------------------------------------------------

deadlock_timeout = 1s
max_locks_per_transaction = 64
max_pred_locks_per_transaction = 64

#------------------------------------------------------------------------------
# VERSION/PLATFORM COMPATIBILITY
#------------------------------------------------------------------------------

# These settings are for PostgreSQL 13+
# Adjust as needed for your PostgreSQL version

#------------------------------------------------------------------------------
# CUSTOM SETTINGS FOR TRIPLECHECK
#------------------------------------------------------------------------------

# Application-specific settings
application_name = 'triplecheck-primary'

# Custom parameters for monitoring
log_statement_stats = off
log_parser_stats = off
log_planner_stats = off
log_executor_stats = off

# Security settings
ssl = on
ssl_cert_file = 'server.crt'
ssl_key_file = 'server.key'
ssl_ca_file = 'ca.crt'
ssl_crl_file = ''
ssl_prefer_server_ciphers = on

# Additional security
row_security = on
log_hostname = on