# HAProxy Configuration for TripleCheck PostgreSQL High Availability
# Provides intelligent routing between primary and replica databases

global
    daemon
    log stdout local0 info
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    
    # SSL/TLS Configuration
    ssl-default-bind-ciphers ECDHE+AESGCM:ECDHE+CHACHA20:RSA+AESGCM:RSA+AES:!aNULL:!MD5:!DSS
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    
    # Performance tuning
    tune.ssl.default-dh-param 2048
    tune.bufsize 32768
    tune.maxrewrite 1024

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    option tcp-check
    retries 3
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout check 5s
    
    # Error handling
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

# Statistics and monitoring interface
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 30s
    stats admin if TRUE
    stats show-legends
    stats show-node
    
    # Authentication (change in production)
    stats auth admin:triplecheck2024
    
    # Custom stats page styling
    stats realm "TripleCheck Database HAProxy Statistics"

# Primary database backend (write operations)
frontend postgres_write
    bind *:5000
    mode tcp
    option tcplog
    
    # Connection limits
    maxconn 500
    
    # Health check
    tcp-request inspect-delay 5s
    tcp-request content accept
    
    # Route to primary backend
    default_backend postgres_primary

# Read-only database frontend (read operations with replica preference)
frontend postgres_read
    bind *:5001
    mode tcp
    option tcplog
    
    # Connection limits
    maxconn 1000
    
    # Health check
    tcp-request inspect-delay 5s
    tcp-request content accept
    
    # Route to read backend
    default_backend postgres_replicas

# Primary database backend
backend postgres_primary
    mode tcp
    balance roundrobin
    option tcp-check
    
    # Health check for primary
    tcp-check connect
    tcp-check send-binary 00000020 # Length
    tcp-check send-binary 00030000 # Protocol version
    tcp-check send-binary 7573657200 # "user\0"
    tcp-check send-binary 706f737467726573 # "postgres"
    tcp-check send-binary 00646174616261736500 # "\0database\0"
    tcp-check send-binary 747269706c65636865636b # "triplecheck"
    tcp-check send-binary 0000 # "\0\0"
    tcp-check expect binary 52 # Authentication OK
    
    # Primary server
    server postgres-primary postgres-primary:5432 check inter 5s rise 2 fall 3 weight 100
    
    # Backup servers (replicas) - only used if primary fails
    server postgres-replica1 postgres-replica1:5432 check inter 5s rise 2 fall 3 weight 50 backup
    server postgres-replica2 postgres-replica2:5432 check inter 5s rise 2 fall 3 weight 30 backup

# Replica database backend (read-only operations)
backend postgres_replicas
    mode tcp
    balance leastconn
    option tcp-check
    
    # Health check for replicas
    tcp-check connect
    tcp-check send-binary 00000020
    tcp-check send-binary 00030000
    tcp-check send-binary 7573657200
    tcp-check send-binary 706f737467726573
    tcp-check send-binary 00646174616261736500
    tcp-check send-binary 747269706c65636865636b
    tcp-check send-binary 0000
    tcp-check expect binary 52
    
    # Replica servers with different weights based on priority
    server postgres-replica1 postgres-replica1:5432 check inter 3s rise 2 fall 3 weight 100
    server postgres-replica2 postgres-replica2:5432 check inter 3s rise 2 fall 3 weight 80
    
    # Primary as backup for read operations
    server postgres-primary postgres-primary:5432 check inter 5s rise 2 fall 3 weight 50 backup

# Advanced backend for intelligent routing based on query type
# This would require a more sophisticated proxy or application-level routing
backend postgres_intelligent
    mode tcp
    balance roundrobin
    option tcp-check
    
    # Custom health check script
    option external-check
    external-check command "/usr/local/bin/postgres-health-check.sh"
    
    # Servers with custom health checks
    server postgres-primary postgres-primary:5432 check inter 5s rise 2 fall 3 weight 100
    server postgres-replica1 postgres-replica1:5432 check inter 3s rise 2 fall 3 weight 90
    server postgres-replica2 postgres-replica2:5432 check inter 3s rise 2 fall 3 weight 80

# Frontend for admin connections (restricted access)
frontend postgres_admin
    bind *:5002
    mode tcp
    
    # IP whitelist for admin access (adjust for your network)
    tcp-request connection reject unless { src 172.20.0.0/16 }
    tcp-request connection reject unless { src 127.0.0.1 }
    tcp-request connection reject unless { src 10.0.0.0/8 }
    
    # Connection limits for admin
    maxconn 10
    
    default_backend postgres_admin_backend

# Admin backend (primary only)
backend postgres_admin_backend
    mode tcp
    option tcp-check
    
    # Only primary server for admin operations
    server postgres-primary postgres-primary:5432 check inter 5s rise 2 fall 3

# Maintenance mode backend (returns 503)
backend maintenance
    mode http
    errorfile 503 /etc/haproxy/errors/503.http

# Custom error pages and maintenance mode
frontend maintenance_check
    bind *:8080
    mode http
    
    # Check for maintenance mode file
    acl maintenance_mode path_beg /maintenance
    use_backend maintenance if maintenance_mode
    
    # Default response
    http-request return status 200 content-type text/plain string "HAProxy Health Check OK"

# Logging configuration
global
    log-send-hostname
    log-tag haproxy-postgres

# Custom log format for PostgreSQL connections
defaults
    capture request header Host len 32
    capture request header User-Agent len 64
    
    # Custom log format
    log-format "%ci:%cp [%t] %ft %b/%s %Tw/%Tc/%Tt %B %ts %ac/%fc/%bc/%sc/%rc %sq/%bq %hr %hs %{+Q}r"

# Rate limiting (optional)
stick-table type ip size 100k expire 30s store http_req_rate(10s),http_err_rate(10s)

# Connection throttling
frontend postgres_write
    # Limit connections per IP
    stick-table type ip size 100k expire 30s store conn_cur
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc_conn_cur(0) gt 50 }

frontend postgres_read
    # Limit connections per IP (higher limit for read operations)
    stick-table type ip size 100k expire 30s store conn_cur
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc_conn_cur(0) gt 100 }