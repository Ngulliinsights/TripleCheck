# PostgreSQL Replica Server Configuration for TripleCheck
# Hot Standby Configuration for Read Replicas

#------------------------------------------------------------------------------
# CONNECTIONS AND AUTHENTICATION
#------------------------------------------------------------------------------

# Connection settings
listen_addresses = '*'
port = 5432
max_connections = 150                   # Fewer connections than primary
superuser_reserved_connections = 3

# Authentication
authentication_timeout = 60s
password_encryption = scram-sha-256

#------------------------------------------------------------------------------
# RESOURCE USAGE (except WAL)
#------------------------------------------------------------------------------

# Memory settings (slightly less than primary)
shared_buffers = 192MB                  # 20% of RAM for replica
effective_cache_size = 1GB              # 75% of RAM
work_mem = 4MB                          # Per operation memory
maintenance_work_mem = 64MB             # Maintenance operations
dynamic_shared_memory_type = posix

# Background writer
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0
bgwriter_flush_after = 512kB

#------------------------------------------------------------------------------
# WRITE AHEAD LOG (WAL) - Replica Configuration
#------------------------------------------------------------------------------

# WAL settings for replica
wal_level = replica                     # Enable replication
wal_log_hints = on                      # Required for pg_rewind
wal_buffers = 16MB                      # WAL buffer size
wal_writer_delay = 200ms                # WAL writer frequency
wal_writer_flush_after = 1MB            # Force flush after this amount

# Checkpoints
checkpoint_timeout = 5min               # Checkpoint frequency
checkpoint_completion_target = 0.9      # Spread checkpoint I/O
checkpoint_flush_after = 256kB          # Force flush during checkpoint
checkpoint_warning = 30s                # Warn if checkpoints are too frequent

# WAL retention (less than primary)
wal_keep_size = 512MB                   # Keep 512MB of WAL files
max_wal_size = 1GB                      # Maximum WAL size before checkpoint
min_wal_size = 80MB                     # Minimum WAL size

#------------------------------------------------------------------------------
# REPLICATION - STANDBY CONFIGURATION
#------------------------------------------------------------------------------

# Hot standby settings
hot_standby = on                        # Enable read-only queries during recovery
hot_standby_feedback = on               # Send feedback to primary about queries
max_standby_archive_delay = 30s         # Max delay for archive recovery
max_standby_streaming_delay = 30s       # Max delay for streaming recovery

# Standby behavior
wal_receiver_timeout = 60s              # Timeout for WAL receiver
wal_retrieve_retry_interval = 5s        # Retry interval for WAL retrieval
recovery_min_apply_delay = 0            # No delay for applying WAL

# Replication connection settings (configured in recovery.conf or postgresql.auto.conf)
# primary_conninfo = 'host=primary-host port=5432 user=replicator password=replica_password application_name=replica-1'
# primary_slot_name = 'replica_1_slot'

#------------------------------------------------------------------------------
# QUERY TUNING
#------------------------------------------------------------------------------

# Planner settings
random_page_cost = 1.1                  # SSD-optimized
effective_io_concurrency = 200          # SSD concurrent I/O
seq_page_cost = 1.0                     # Sequential scan cost

# Query execution (reduced for replica)
max_parallel_workers_per_gather = 2     # Parallel query workers
max_parallel_workers = 6                # Total parallel workers (less than primary)
max_parallel_maintenance_workers = 1    # Parallel maintenance workers

#------------------------------------------------------------------------------
# ERROR REPORTING AND LOGGING
#------------------------------------------------------------------------------

# Logging settings
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-replica-%Y-%m-%d_%H%M%S.log'
log_file_mode = 0600
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = on

# What to log
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 1000       # Log slow queries (>1s)
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 10MB
log_autovacuum_min_duration = 0
log_error_verbosity = default

# Log format
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_statement = 'none'                  # Don't log statements on replica
log_replication_commands = on           # Log replication commands

# Replica-specific logging
log_recovery_conflict_waits = on        # Log recovery conflicts

#------------------------------------------------------------------------------
# RUNTIME STATISTICS
#------------------------------------------------------------------------------

# Statistics settings
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all
stats_temp_directory = 'pg_stat_tmp'

# Query statistics (if needed on replica)
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000           # Fewer than primary
pg_stat_statements.track = all
pg_stat_statements.track_utility = on
pg_stat_statements.save = on

#------------------------------------------------------------------------------
# AUTOVACUUM PARAMETERS
#------------------------------------------------------------------------------

# Autovacuum settings (minimal on replica)
autovacuum = on
autovacuum_max_workers = 2              # Fewer workers than primary
autovacuum_naptime = 2min               # Less frequent than primary
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.2
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.1
autovacuum_vacuum_cost_delay = 20ms
autovacuum_vacuum_cost_limit = 200

#------------------------------------------------------------------------------
# CLIENT CONNECTION DEFAULTS
#------------------------------------------------------------------------------

# Locale and formatting
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'

# Connection defaults
default_transaction_isolation = 'read committed'
statement_timeout = 300s                # 5 minute statement timeout
lock_timeout = 30s                      # 30 second lock timeout
idle_in_transaction_session_timeout = 600s  # 10 minute idle timeout

# Read-only enforcement
default_transaction_read_only = on      # Enforce read-only by default

#------------------------------------------------------------------------------
# LOCK MANAGEMENT
#------------------------------------------------------------------------------

deadlock_timeout = 1s
max_locks_per_transaction = 64
max_pred_locks_per_transaction = 64

#------------------------------------------------------------------------------
# STANDBY-SPECIFIC SETTINGS
#------------------------------------------------------------------------------

# Recovery settings
restore_command = 'cp /var/lib/postgresql/wal_archive/%f %p'
recovery_target_timeline = 'latest'

# Standby mode settings
standby_mode = on                       # Enable standby mode
trigger_file = '/tmp/postgresql.trigger.5432'  # File to trigger promotion

#------------------------------------------------------------------------------
# CUSTOM SETTINGS FOR TRIPLECHECK REPLICA
#------------------------------------------------------------------------------

# Application-specific settings
application_name = 'triplecheck-replica'

# Custom parameters for monitoring
log_statement_stats = off
log_parser_stats = off
log_planner_stats = off
log_executor_stats = off

# Security settings
ssl = on
ssl_cert_file = 'server.crt'
ssl_key_file = 'server.key'
ssl_ca_file = 'ca.crt'
ssl_crl_file = ''
ssl_prefer_server_ciphers = on

# Additional security
row_security = on
log_hostname = on

# Replica-specific monitoring
log_standby_snapshot_interval = 60s     # Log standby snapshots