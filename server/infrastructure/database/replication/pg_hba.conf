# PostgreSQL Client Authentication Configuration File
# TripleCheck High Availability Setup

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# "local" is for Unix domain socket connections only
local   all             all                                     trust
local   replication     all                                     trust

# IPv4 local connections:
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# Allow replication connections from replica servers
host    replication     replicator      172.20.0.0/16           scram-sha-256
host    replication     replicator      postgres-replica1       scram-sha-256
host    replication     replicator      postgres-replica2       scram-sha-256

# Allow connections from application servers
host    all             postgres        172.20.0.0/16           scram-sha-256
host    all             triplecheck     172.20.0.0/16           scram-sha-256

# Allow connections from HAProxy health checks
host    all             postgres        172.20.0.20/32          scram-sha-256

# Allow connections from PgBouncer
host    all             postgres        172.20.0.30/32          scram-sha-256

# Allow connections from monitoring systems
host    all             postgres        172.20.0.0/16           scram-sha-256

# Deny all other connections
host    all             all             0.0.0.0/0               reject
host    all             all             ::/0                    reject

# SSL connections (if SSL is configured)
hostssl all             all             172.20.0.0/16           scram-sha-256
hostssl replication     replicator      172.20.0.0/16           scram-sha-256

# Special rules for specific users
host    triplecheck     triplecheck_app 172.20.0.0/16           scram-sha-256
host    triplecheck     triplecheck_ro  172.20.0.0/16           scram-sha-256
host    triplecheck     triplecheck_backup 172.20.0.0/16        scram-sha-256

# Development/testing connections (remove in production)
host    all             all             10.0.0.0/8              scram-sha-256
host    all             all             192.168.0.0/16          scram-sha-256